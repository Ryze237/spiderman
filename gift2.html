<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Memory For You</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                radial-gradient(
                    circle at center,
                    #fff7f9 0%,
                    #ffe8ee 45%,
                    #ffd4df 100%
                );

            color: #713b4b;

            overflow: hidden;
        }


        /* =========================================
           PAGE
        ========================================= */

        .memory-page {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 30px;

            position: relative;
        }


        /* =========================================
           TITLE
        ========================================= */

        .memory-title {

            font-size: 38px;

            color: #b94f6d;

            margin-bottom: 8px;

            opacity: 0;

            transform:
                translateY(-15px);

            animation:
                titleIn
                .8s
                ease
                forwards;
        }


        .memory-subtitle {

            font-size: 16px;

            color: #986071;

            margin-bottom: 30px;

            opacity: 0;

            animation:
                subtitleIn
                .8s
                ease
                .3s
                forwards;
        }


        @keyframes titleIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes subtitleIn {

            to {

                opacity: 1;
            }
        }


        /* =========================================
           PHOTO
        ========================================= */

        .photo-frame {

            width: min(
                600px,
                82vw
            );

            height: min(
                480px,
                52vh
            );

            padding: 4px;

            background:
                rgba(255,255,255,.8);

            border-radius: 18px;

            box-shadow:
                0 25px 60px
                rgba(125,55,76,.18);

            opacity: 0;

            transform:
                scale(.9)
                translateY(20px);

            animation:
                photoIn
                1s
                cubic-bezier(.16,1,.3,1)
                .5s
                forwards;
        }


        .photo-frame img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 12px;

            display: block;
        }


        @keyframes photoIn {

            0% {

                opacity: 0;

                transform:
                    scale(.9)
                    translateY(20px);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .memory-message {

            margin-top: 22px;

            font-size: 18px;

            color: #87475b;

            text-align: center;

            opacity: 0;

            animation:
                messageIn
                .8s
                ease
                1.2s
                forwards;
        }


        @keyframes messageIn {

            to {

                opacity: 1;
            }
        }


/* =========================================
   DIAGONAL MUSIC PLAYER
========================================= */

.music-player {

    position: fixed;

    right: 35px;
left: auto;
    bottom: 35px;

    width: 250px;

    padding: 12px 15px;

    display: flex;

    align-items: center;

    gap: 12px;

    background:
        rgba(255,255,255,.88);

    border:
        1px solid
        rgba(183,110,121,.25);

    border-radius: 18px;

    box-shadow:
        0 15px 35px
        rgba(125,55,76,.18);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    transform:
        rotate(-8deg)
        translateY(20px);

    opacity: 0;

    animation:
        musicPlayerIn
        .8s
        cubic-bezier(.16,1,.3,1)
        1.5s
        forwards;

    z-index: 20;
}


@keyframes musicPlayerIn {

    0% {

        opacity: 0;

        transform:
            rotate(-8deg)
            translateY(30px)
            scale(.9);
    }

    100% {

        opacity: 1;

        transform:
            rotate(-8deg)
            translateY(0)
            scale(1);
    }
}

/* =========================================
   SONG COVER
========================================= */

.song-cover {

    width: 48px;
    height: 48px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 10px;

    box-shadow:
        0 5px 12px
        rgba(125,55,76,.18);
}

/* =========================================
   PLAY BUTTON
========================================= */

.play-button {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: none;

    border-radius: 50%;

    background:
        #c65c78;

    color: white;

    font-size: 15px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        transform .15s ease;
}


.play-button:hover {

    transform:
        scale(1.1);
}


.play-button:active {

    transform:
        scale(.94);
}


/* =========================================
   SONG INFO
========================================= */

.song-info {

    flex: 1;

    min-width: 0;
}


.song-title {

    color: #713b4b;

    font-size: 13px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.song-status {

    color: #a16a7b;

    font-size: 11px;

    margin-top: 2px;
}


/* =========================================
   PROGRESS
========================================= */

.progress-container {

    width: 100%;

    height: 3px;

    background:
        #efd5dc;

    border-radius: 10px;

    margin-top: 6px;

    cursor: pointer;

    overflow: hidden;
}


.progress {

    width: 0%;

    height: 100%;

    background:
        #c65c78;

    border-radius: 10px;
}


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            position: absolute;

            bottom: 25px;

            border: none;

            background:
                rgba(255,255,255,.7);

            color: #a64e69;

            padding:
                10px
                22px;

            border-radius: 25px;

            cursor: pointer;

            font-family: inherit;

            border:
                1px solid
                rgba(183,110,121,.2);

            transition:
                transform .15s ease;
        }


        .back-button:hover {

            transform:
                translateY(-3px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        
        @media (max-width: 600px) {

    body {
        overflow-y: auto;
    }

    .memory-title {
        font-size: 28px;
    }

    .memory-subtitle {
        font-size: 14px;
    }

    .photo-frame {

        width: 88vw;

        height: 48vh;
    }

    .memory-message {
        font-size: 16px;
    }

    .music-player {

        width: 90vw;

        right: 5vw;

        bottom: 75px;
    }

}

    </style>

</head>


<body>


    <main class="memory-page">


        <h1 class="memory-title">
            Your Smile ♡
        </h1>


        <p class="memory-subtitle">
            Some moments are worth keeping forever.
        </p>


        <!-- =====================================
             PHOTO
        ====================================== -->

        <div class="photo-frame">

            <img
                src="images/clarissa1x.jpeg"
                alt="Our memory"
            >

        </div>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <p class="memory-message">
            I hope this little moment always makes you smile. ♡
        </p>


        <!-- =====================================
             MUSIC
        ====================================== -->

        <div class="music-player">

    <img
        src="images/song1.jpeg"
        alt="Song cover"
        class="song-cover"
    >


    <button
        class="play-button"
        id="playButton"
    >
        ▶
    </button>


    <div class="song-info">

        <div class="song-title">
          Birds Of A Feather
        </div>

        <div
            class="song-status"
            id="songStatus"
        >
            Press play
        </div>


        <div
            class="progress-container"
            id="progressContainer"
        >

            <div
                class="progress"
                id="progress"
            ></div>

        </div>

    </div>

</div>


        <!-- =====================================
             AUDIO
        ====================================== -->

        <audio
            id="music"
            src="music/song.mp4"
        ></audio>


        <!-- =====================================
             BACK
        ====================================== -->

        <button
            class="back-button"
            onclick="window.location.href='surprise.html'"
        >
            ← Back to surprises
        </button>


    </main>


    <script>

        const music =
            document.getElementById(
                "music"
            );

        const playButton =
            document.getElementById(
                "playButton"
            );

        const songStatus =
            document.getElementById(
                "songStatus"
            );

        const progress =
            document.getElementById(
                "progress"
            );

        const progressContainer =
            document.getElementById(
                "progressContainer"
            );


        /* =====================================
           PLAY / PAUSE
        ====================================== */

        playButton.addEventListener(
            "click",
            () => {

                if (music.paused) {

                    music.play();

                    playButton.textContent =
                        "Ⅱ";

                    songStatus.textContent =
                        "Playing ♡";

                }

                else {

                    music.pause();

                    playButton.textContent =
                        "▶";

                    songStatus.textContent =
                        "Paused";

                }

            }
        );


        /* =====================================
           PROGRESS
        ====================================== */

        music.addEventListener(
            "timeupdate",
            () => {

                if (!music.duration) {
                    return;
                }

                const percent =
                    (
                        music.currentTime /
                        music.duration
                    ) * 100;

                progress.style.width =
                    `${percent}%`;

            }
        );


        /* =====================================
           CLICK PROGRESS BAR
        ====================================== */

        progressContainer.addEventListener(
            "click",
            (event) => {

                const rect =
                    progressContainer
                    .getBoundingClientRect();

                const position =
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width;

                music.currentTime =
                    position *
                    music.duration;

            }
        );


        /* =====================================
           SONG ENDED
        ====================================== */

        music.addEventListener(
            "ended",
            () => {

                playButton.textContent =
                    "▶";

                songStatus.textContent =
                    "Press play";

                progress.style.width =
                    "0%";

            }
        );

    </script>


</body>

</html>
