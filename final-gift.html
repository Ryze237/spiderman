<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Final Surprise ♡</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    #ffffff 0%,
                    #fff0f4 30%,
                    transparent 60%
                ),
                #ffdfe7;

            color: #713b4b;

        }


        /* =========================================
           PAGE
        ========================================= */

        .final-page {

            min-height: 100vh;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;

        }


        /* =========================================
           INTRO
        ========================================= */

        .title {

            font-size:
                clamp(
                    32px,
                    6vw,
                    55px
                );

            font-weight: 900;

            color: #c65373;

            margin-bottom: 12px;

        }


        .subtitle {

            font-size:
                clamp(
                    15px,
                    2.5vw,
                    19px
                );

            color: #a15c70;

            font-weight: 600;

            margin-bottom: 45px;

        }


        /* =========================================
           GIFT AREA
        ========================================= */

        .gift-area {

            position: relative;

            width: 280px;

            height: 280px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        /* =========================================
           GIFT
        ========================================= */

        .gift {

            position: relative;

            width: 180px;

            height: 170px;

            transition:
                transform .3s ease;

        }


        /* =========================================
           BOX
        ========================================= */

        .box {

            position: absolute;

            bottom: 0;

            left: 15px;

            width: 150px;

            height: 115px;

            background:
                linear-gradient(
                    135deg,
                    #c65373,
                    #e98aa3
                );

            border-radius: 8px;

            box-shadow:
                0 25px 45px
                rgba(
                    125,
                    55,
                    76,
                    .25
                );

            z-index: 2;

        }


        /* =========================================
           LID
        ========================================= */

        .lid {

            position: absolute;

            top: 35px;

            left: 0;

            width: 180px;

            height: 40px;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #d86a87,
                    #f19eb3
                );

            box-shadow:
                0 7px 15px
                rgba(
                    125,
                    55,
                    76,
                    .15
                );

            z-index: 5;

            transition:
                transform .7s
                cubic-bezier(
                    .16,
                    1,
                    .3,
                    1
                );

        }


        /* =========================================
           RIBBON
        ========================================= */

        .vertical-ribbon {

            position: absolute;

            bottom: 0;

            left: 78px;

            width: 27px;

            height: 150px;

            background:
                #f8d6df;

            z-index: 6;

        }


        .horizontal-ribbon {

            position: absolute;

            left: 0;

            top: 35px;

            width: 180px;

            height: 14px;

            background:
                #f8d6df;

            z-index: 7;

        }


        /* =========================================
           BOW
        ========================================= */

        .bow {

            position: absolute;

            top: 0;

            left: 50%;

            width: 80px;

            height: 55px;

            transform:
                translateX(-50%);

            z-index: 10;

        }


        .bow-left,
        .bow-right {

            position: absolute;

            top: 4px;

            width: 48px;

            height: 38px;

            background:
                #f09bb0;

            border-radius:
                50%;

        }


        .bow-left {

            left: 0;

            transform:
                rotate(-25deg);

        }


        .bow-right {

            right: 0;

            transform:
                rotate(25deg);

        }


        .bow-center {

            position: absolute;

            left: 50%;

            top: 15px;

            width: 26px;

            height: 26px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                #df708e;

            z-index: 5;

        }


        /* =========================================
           HOVER
        ========================================= */

        .gift-area:hover .gift {

            transform:
                translateY(-8px)
                scale(1.04);

        }


        /* =========================================
           SHAKE
        ========================================= */

        .gift-area.shake .gift {

            animation:
                intenseShake
                .075s
                linear
                infinite;

        }


        @keyframes intenseShake {

            0% {
                transform:
                    translateX(0)
                    rotate(0);
            }

            20% {
                transform:
                    translateX(-13px)
                    rotate(-4deg);
            }

            40% {
                transform:
                    translateX(13px)
                    rotate(4deg);
            }

            60% {
                transform:
                    translateX(-11px)
                    rotate(-3deg);
            }

            80% {
                transform:
                    translateX(11px)
                    rotate(3deg);
            }

            100% {
                transform:
                    translateX(0)
                    rotate(0);
            }

        }


        /* =========================================
           OPEN LID
        ========================================= */

        .gift-area.open .lid {

            transform:
                translateY(-100px)
                rotate(-8deg);

        }


        .gift-area.open .bow {

            transform:
                translate(
                    -50%,
                    -100px
                )
                rotate(-8deg);

            transition:
                .7s
                cubic-bezier(
                    .16,
                    1,
                    .3,
                    1
                );

        }


        /* =========================================
           CLICK MESSAGE
        ========================================= */

        .tap-message {

            margin-top: 25px;

            font-size: 14px;

            color: #a15c70;

            font-weight: 700;

            animation:
                softPulse
                1.8s
                ease-in-out
                infinite;

        }


        @keyframes softPulse {

            0%,
            100% {
                opacity: .5;
            }

            50% {
                opacity: 1;
            }

        }


        /* =========================================
           REWARD SCREEN
        ========================================= */

        .reward {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at center,
                    #ffffff,
                    #ffe9ef 65%
                );

            opacity: 0;

            visibility: hidden;

            transform:
                scale(.85);

            transition:
                opacity .7s ease,
                transform .7s
                cubic-bezier(
                    .16,
                    1,
                    .3,
                    1
                );

            z-index: 100;

        }


        .reward.show {

            opacity: 1;

            visibility: visible;

            transform:
                scale(1);

        }


        .reward-label {

            font-size: 17px;

            font-weight: 800;

            color: #a15c70;

            letter-spacing: 2px;

            text-transform:
                uppercase;

            margin-bottom: 12px;

        }


        .reward-title {

            font-size:
                clamp(
                    50px,
                    11vw,
                    100px
                );

            font-weight: 950;

            color: #c65373;

            line-height: 1;

            margin-bottom: 25px;

        }


        .reward-main {

            font-size:
                clamp(
                    25px,
                    5vw,
                    45px
                );

            font-weight: 900;

            color: #713b4b;

        }


        .reward-sub {

            margin-top: 15px;

            font-size: 17px;

            color: #a15c70;

        }


        /* =========================================
           HEARTS
        ========================================= */

        .heart {

            position: fixed;

            left: 50%;

            top: 50%;

            pointer-events: none;

            color: #d95372;

            font-size: 25px;

            z-index: 200;

            animation:
                heartExplosion
                1.4s
                cubic-bezier(
                    .16,
                    1,
                    .3,
                    1
                )
                forwards;

        }


        @keyframes heartExplosion {

            0% {

                opacity: 1;

                transform:
                    translate(
                        0,
                        0
                    )
                    scale(.3)
                    rotate(0);

            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(
                        var(--scale)
                    )
                    rotate(
                        var(--rotation)
                    );

            }

        }


        /* =========================================
           SPARKLES
        ========================================= */

        .sparkle {

            position: fixed;

            left: 50%;

            top: 50%;

            color: #fff;

            font-size: 22px;

            pointer-events: none;

            z-index: 201;

            animation:
                sparklePop
                1s
                ease-out
                forwards;

        }


        @keyframes sparklePop {

            0% {

                opacity: 1;

                transform:
                    translate(
                        0,
                        0
                    )
                    scale(.2);

            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(1.5);

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .final-page {

                padding:
                    20px;

            }


            .subtitle {

                margin-bottom: 25px;

            }


            .gift-area {

                transform:
                    scale(.85);

            }


            .gift-area:hover .gift {

                transform:
                    none;

            }


            .tap-message {

                margin-top: 5px;

            }


            .reward-main {

    max-width: 340px;

    padding: 0 10px;

    line-height: 1.2;

}

.reward-sub {

    max-width: 320px;

    line-height: 1.4;

}

        }


    </style>

</head>


<body>


<main class="final-page">


    <h1 class="title">
        One last surprise ♡
    </h1>


    <p class="subtitle">
        Are you ready for the final one?
    </p>


    <div
        class="gift-area"
        id="giftArea"
    >


        <div class="gift">


            <div class="bow">

                <div class="bow-left"></div>

                <div class="bow-right"></div>

                <div class="bow-center"></div>

            </div>


            <div
                class="lid"
                id="lid"
            ></div>


            <div class="box"></div>


            <div class="horizontal-ribbon"></div>

            <div class="vertical-ribbon"></div>


        </div>


    </div>


    <p class="tap-message">
        Tap the gift ♡
    </p>


</main>



<!-- =========================================
     REWARD
========================================= -->

<section
    class="reward"
    id="reward"
>


    <div class="reward-label">
        A little surprise for you
    </div>


    <h2 class="reward-title">
        YOU WON! 🎉
    </h2>


    <p class="reward-main">
        A skin of your choice ♡
    </p>


    <p class="reward-sub">
        Pick whichever one you want.
    </p>


</section>



<script>


const giftArea =
    document.getElementById(
        "giftArea"
    );


const reward =
    document.getElementById(
        "reward"
    );


let opened = false;



/* =========================================
   CLICK
========================================= */

giftArea.addEventListener(
    "click",
    () => {

        if (opened) {

            return;

        }


        opened = true;


        /*
            Strong shaking
        */

        giftArea.classList.add(
            "shake"
        );


        /*
            Explosion begins
        */

        createHearts();

        createSparkles();


        /*
            Stop shaking
            and open gift.
        */

        setTimeout(
            () => {

                giftArea.classList.remove(
                    "shake"
                );

                giftArea.classList.add(
                    "open"
                );

            },
            1300
        );


        /*
            Show reward.
        */

        setTimeout(
            () => {

                reward.classList.add(
                    "show"
                );

                createHearts();

                createSparkles();

            },
            1900
        );

    }
);



/* =========================================
   HEART EXPLOSION
========================================= */

function createHearts() {


    const symbols = [

        "♡",
        "♥",
        "♡",
        "♥",
        "✦",
        "♡",
        "♥"

    ];


    for (
        let i = 0;
        i < 35;
        i++
    ) {


        const heart =
            document.createElement(
                "span"
            );


        heart.className =
            "heart";


        heart.textContent =
            symbols[
                i %
                symbols.length
            ];


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            100 +
            Math.random() *
            300;


        heart.style.setProperty(
            "--x",
            `${Math.cos(angle) * distance}px`
        );


        heart.style.setProperty(
            "--y",
            `${Math.sin(angle) * distance}px`
        );


        heart.style.setProperty(
            "--scale",
            `${.7 + Math.random() * 1.1}`
        );


        heart.style.setProperty(
            "--rotation",
            `${Math.random() * 120 - 60}deg`
        );


        heart.style.fontSize =
            `${16 + Math.random() * 20}px`;


        document.body.appendChild(
            heart
        );


        heart.addEventListener(
            "animationend",
            () => {

                heart.remove();

            },
            {
                once: true
            }
        );

    }

}



/* =========================================
   SPARKLES
========================================= */

function createSparkles() {


    for (
        let i = 0;
        i < 25;
        i++
    ) {


        const sparkle =
            document.createElement(
                "span"
            );


        sparkle.className =
            "sparkle";


        sparkle.textContent =
            "✦";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            100 +
            Math.random() *
            280;


        sparkle.style.setProperty(
            "--x",
            `${Math.cos(angle) * distance}px`
        );


        sparkle.style.setProperty(
            "--y",
            `${Math.sin(angle) * distance}px`
        );


        sparkle.style.fontSize =
            `${12 + Math.random() * 20}px`;


        document.body.appendChild(
            sparkle
        );


        sparkle.addEventListener(
            "animationend",
            () => {

                sparkle.remove();

            },
            {
                once: true
            }
        );

    }

}


</script>


</body>

</html>
